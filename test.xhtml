<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-Hant" lang="zh-Hant">
<head>
    <title>说明</title>
    <style type="text/css">
        .poem_wrapper {
            display: grid;
            grid-template-columns: 1fr auto 1fr;

            align-items: center; /* 垂直居中对齐 */
        }
        .author {
            text-align: right; /* 让作者名字靠右，贴近诗句 */
            font-weight: bold;
        }

        /* 诗句样式 */
        .poem_lines {
            text-align: center; /* 诗句文字本身居中 */
        }

    </style>
</head>
<body>
<p>如是我聞，爾時，世尊住舍衛城祇樹給孤獨園。</p>
<p>爾時，有天神於黎明放其殊勝妙光，徧照祇園，詣世尊處。詣已，敬禮世尊，立於一面。</p>
<p>立一面已，彼天神白世尊曰：「友！卿如何度瀑流耶？」〔世尊曰〕：「友！我不住不求以度瀑流。」「友！卿如何不住不求以度瀑流耶？」〔世尊曰〕：「友！我住時沈，求時溺。友！我如是不住不求以度瀑流。」</p>
<div class="poem-wrapper">

    <div class="author"></div>
    <div class="poem-lines">
        <p>「不住與不求</p>
        <p>度世間執著</p>
        <p>涅槃婆羅門</p>
        <p>久久我見知」</p>
    </div>
</div>
<p>彼天神作如是言得大師嘉賞、認證，天神知得大師、認證，敬禮世尊右繞而去。</p>

</body>
</html>
