8.真實苦行者所行
<br>　「71.
<br>　　再者當我是，名為真實苦行者時，
<br>　　以真實我保護世間，我對人們建立(作)和合的。」[↝Jat.73]
<br>　　真實苦行者所行第八。
<br>

8. Saccatāpasacariyā
<br>　　71.
<br>　　‘‘Punāparaṃ yadā homi, tāpaso saccasavhayo;
<br>　　Saccena lokaṃ pālesiṃ, samaggaṃ janamakāsaha’’nti.
<br>　　Saccatāpasacariyaṃ aṭṭhamaṃ.
<br>
