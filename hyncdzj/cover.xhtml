<html lang="zh" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <title>Cover</title>
    <style>

        html {
            margin: 0;
            border: 0px solid yellow;
        }

        body {
            display: grid;

            background-color: #20855D;
            background-color: $background_color;

            color: #5e1633;
            color: $font_color;
            / * height: 100vh; */
            margin: 0;

            border: 0px solid red;

            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 10fr 1fr;
        }

        .series {
            font-family: "$series_font_name";
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 1;
            grid-row-end: 2;

            display: grid;
            justify-items: start;
            text-align: left;
            writing-mode: vertical-lr;

            border: 1px solid black;
            font-size: 6vw;

        }


        .book_name {
            letter-spacing: $book_name_latter_spacing;
            margin-bottom: -$book_name_latter_spacing;
            font-family: "$book_name_font_name";
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;

            display: grid;
            border: 1px solid red;

            font-size: $book_name_font_size;
            font-weight: bold;

            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;

        }


        .translator {
            font-family: "Source Han Sans TW";
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 1;
            grid-row-end: 2;

            display: grid;
            font-size: 6vw;
            border: 1px solid black;
            writing-mode: vertical-rl;

            align-items: center;
            justify-content: center;

        }

        .translate {
            font-family: "$translate_font_name"


        .footer {
            font-family: "$footer_font_name"
            grid-column-start: 1;
            grid-column-end: 4;
            grid-row-start: 2;
            grid-row-end: 3;

            display: grid;
            border: 1px solid yellow;
            align-items: center;
            text-align: center;
            justify-content: center;
            font-size: 4vw;
        }

    </style>
</head>


<body>

<div class="series">
    $series
</div>

<div class="book_name">
    $book_name
</div>

<div class="translator">
    $translator<span class="translate">$translate</span>
</div>

<div class="footer">
    $footer
</div>


</body>
</html>
