<html lang="zh" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <title>Cover</title>
    <style>
        :root {
            --other_opacity: 0.8;
        }

        html {
            height: 100vh;
            width: 100vw;
            margin: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            /* padding: 0px; */
            margin: 0px;
            background-color: #009999;
            background-color: $background_color;

        }


        .middle {
            width: 100vw;
            height: 100vh;
            z-index: 2;
            position: absolute;
            background-image: url("/mnt/data/projects/nikaya/hyncdzj/Original_Dharma_Wheel.svg");
            background-position: 50% 3%;
            background-size: 94vw;
            background-repeat: no-repeat;
            opacity: 0.1;
        }

        .top {
            width: 100vw;
            height: 100vh;
            z-index: 3;
            position: absolute;
            color: $font_color;

            display: grid;
            grid-template-columns: 2fr 4fr 2fr;
            grid-template-rows: 13fr 1fr;
        }

        .series_c {
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 1;
            grid-row-end: 2;

            display: grid;
            align-items: start;
            justify-items: start;

            opacity: var(--other_opacity);
            /* border: 2px solid red; */
        }
        .series {
            margin: 2vw;

            writing-mode: vertical-lr;
            font-size: 7vw;
            font-family: "$series_font_name";
        }

        .book_name_c {
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;

            display: grid;
            align-items: center;
            justify-content: center;
            text-align: center;

            /* border: 2px solid red; */
        }
        .book_name {
            writing-mode: vertical-rl;
            font-size: $book_name_font_size;
            font-family: "$book_name_font_name";
        }

        .space {
            margin: $book_name_space_margin;
        }

        .translator_c {
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 1;
            grid-row-end: 2;

            display: grid;
            writing-mode: vertical-rl;
            align-items: center;
            text-align: center;
            justify-content: center;

            opacity: var(--other_opacity);
            font-size: 9vw;
            font-family: "Source Han Sans TW Medium";

            /* border: 1px solid black; */
        }
        .translate {
            font-family: "$translate_font_name";
        }


        .footer_c {
            margin: 0px;
            font-family: "$footer_font_name";
            grid-column-start: 1;
            grid-column-end: 4;
            grid-row-start: 2;
            grid-row-end: 3;

            display: grid;
            align-items: center;
            text-align: center;
            justify-content: center;

            opacity: var(--other_opacity);
            /* border: 2px solid red; */
            margin: 0 2vw 0 2vw;
            border-top: 0.2vh solid;
        }
        .footer {
            font-size: 3.5vw;
        }

        span {
            margin: 0;
            /* border: 2px solid blue; */
        }

    </style>
</head>


<body>

<div class="middle" />

<div class="top">
    <div class="series_c">
        <span class="series">$series</span>
    </div>

    <div class="book_name_c">
        <span class="book_name">$book_name</span>
    </div>

    <div class="translator_c">
        <span>$translator<span class="translate">$translate</span></span>
    </div>

    <div class="footer_c">
        <span class="footer">$footer</span>
    </div>
</div>

</body>
</html>
