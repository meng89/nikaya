<html lang="zh" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <title>Cover</title>
    <style>

        html {
            height: 100vh;
            margin: 0;
            /*padding: 0px;*/
            /*border: 10px solid blue;*/
        }

        body {
            background-color: $background_color;
            color: $font_color;
            height: 100vh;
            margin: 0px;
            /*padding: 0px;*/

            border: 0px solid red;
            display: grid;
            grid-template-columns: 2fr 4fr 2fr;
            grid-template-rows: 9fr 1fr;
        }

        .series {
            font-family: "$series_font_name";

            display: grid;
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 1;
            grid-row-end: 2;

            justify-items: start;
            text-align: left;
            writing-mode: vertical-lr;

            border: 1px solid black;
            font-size: 7vw;

        }

        .book_name {
            font-family: "$book_name_font_name";

            display: grid;
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;

            border: 1px solid red;

            font-size: $book_name_font_size;

            align-items: center;
            justify-content: center;
            text-align: center;
            writing-mode: vertical-rl;

        }


        .translator {
            font-family: "Source Han Sans TW";

            display: grid;
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 1;
            grid-row-end: 2;

            font-size: 9vw;
            border: 1px solid black;
            writing-mode: vertical-rl;

            align-items: center;
            text-align: center;
            justify-content: center;

        }

        .translate {
            font-family: "$translate_font_name";
        }


        .footer {margin: 0px;
            font-family: "$footer_font_name";
            grid-column-start: 1;
            grid-column-end: 4;
            grid-row-start: 2;
            grid-row-end: 3;

            display: grid;
            border: 1px solid blue;
            align-items: center;
            text-align: center;
            justify-content: center;
            font-size: 4vw;
        }

        .space {
            margin: $book_name_space_margin;
        }

        p {
            margin: 0;
            border: 1px solid blue;
            align-items: center;
            text-align: center;
            justify-content: center;
        }
        div{margin: 0px;}


    </style>
</head>


<body>

<div class="series">
    <p>$series</p>
</div>

<div class="book_name">
    <p>$book_name</p>
</div>

<div class="translator">
    <p>$translator<span class="translate">$translate</span></p>
</div>

<div class="footer">
    <p>$footer1</p>
    <p>$footer2</p>
</div>

</body>
</html>
