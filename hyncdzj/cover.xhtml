<html lang="zh" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <title>Cover</title>
    <style>

        html {
            height: 100vh;
            margin: 0;
        }

        body {
            height: 100vh;
            /* padding: 0px; */
            margin: 0px;
            background-color: $background_color;
            color: $font_color;

            display: grid;
            grid-template-columns: 2fr 4fr 2fr;
            grid-template-rows: 13fr 1fr;
        }

        .series_c {
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 1;
            grid-row-end: 2;

            display: grid;
            align-items: start;
            justify-items: start;

            border: 2px solid red;
        }
        .series {
            margin: 2vw;

            writing-mode: vertical-lr;
            font-size: 7vw;
            font-family: "$series_font_name";
        }

        .book_name_c {
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;

            display: grid;
            align-items: center;
            justify-content: center;
            text-align: center;

            border: 2px solid red;
        }
        .book_name {
            writing-mode: vertical-rl;
            font-size: $book_name_font_size;
            font-family: "$book_name_font_name";
        }

        .space {
            margin: $book_name_space_margin;
        }

        .translator_c {
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 1;
            grid-row-end: 2;

            display: grid;

            writing-mode: vertical-rl;
            align-items: center;
            text-align: center;
            justify-content: center;

            font-size: 9vw;
            font-family: "Source Han Sans TW Medium";
            border: 1px solid black;
        }
        .translate {
            font-family: "$translate_font_name";
        }


        .footer_c {
            margin: 0px;
            font-family: "$footer_font_name";
            grid-column-start: 1;
            grid-column-end: 4;
            grid-row-start: 2;
            grid-row-end: 3;

            display: grid;
            align-items: center;
            text-align: center;
            justify-content: center;

            border: 2px solid red;
        }
        .footer {
            font-size: 3.5vw;
        }

        span {
            margin: 0;
            border: 2px solid blue;
        }

    </style>
</head>


<body>

<div class="series_c">
    <span class="series">$series</span>
</div>

<div class="book_name_c">
    <span class="book_name">$book_name</span>
</div>

<div class="translator_c">
    <span>$translator<span class="translate">$translate</span></span>
</div>

<div class="footer_c">
    <span class="footer">$footer</span>
</div>

</body>
</html>
