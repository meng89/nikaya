<html lang="zh" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <title>Cover</title>
    <style>

        html {
            margin: 0;
            border: 0px solid yellow;
        }

        body {
            background-color: orange;
            color: #073c9f;
            height: 100vh;
            margin: 0;

            border: 0px solid red;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 10fr 1fr;
        }

        .series {
            font-family: "Source Han Sans CN";
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 1;
            grid-row-end: 2;

            display: grid;
            justify-items: start;
            text-align: left;
            writing-mode: vertical-lr;

            border: 1px solid black;
            font-size: 6vw;

        }


        .book_name {
            font-family: "Source Han Sans CN";
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;

            border: 1px solid red;

            font-size: 18vw;

            display: grid;
            align-items: center;
            justify-content: center;
            text-align: center;
            writing-mode: vertical-rl;

        }


        .translator {
            font-family: "Source Han Sans TW";
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 1;
            grid-row-end: 2;

            display: grid;
            font-size: 6vw;
            border: 1px solid black;
            writing-mode: vertical-rl;

            align-items: center;
            justify-content: center;

        }

        .translate {
            font-family: "Source Han Sans CN";


        .footer {
            font-family: "Source Han Sans CN";
            grid-column-start: 1;
            grid-column-end: 4;
            grid-row-start: 2;
            grid-row-end: 3;

            display: grid;
            border: 1px solid yellow;
            align-items: center;
            text-align: center;
            justify-content: center;
            font-size: 4vw;
        }

        .space {
            letter-spacing: 1em;
        }

        p {
            border: 1px solid blue;
            align-items: center;
            text-align: left;
            justify-content: center;
        }


    </style>
</head>


<body>

<div class="series">
    <p>元亨寺　汉译南传大藏经·律藏</p>
</div>

<div class="book_name">
    <p>經<span class="space">&#8204;</span>分<span class="space">&#8204;</span>別</p>
</div>

<div class="translator">
    <p>通妙<span class="translate">译</span></p>
</div>

<div class="footer">
    <p>基于 CBETA 數位化成果2025年12月09日制简体版</p>
</div>


</body>
</html>
